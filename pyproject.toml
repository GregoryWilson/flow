[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-music"
version = "0.1.0"
description = "A local-first generative musician and musical knowledge system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Greg Wilson" }]
dependencies = []

[project.optional-dependencies]
audio = [
  "librosa>=0.10.2",
  "numpy>=1.26",
  "soundfile>=0.12.1",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
flow = "flow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

